<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#avatarGrad)" />
  <!-- Pattern -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="180" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 15" />
    <circle cx="200" cy="200" r="140" fill="none" stroke="#ffffff" stroke-width="2" />
    <path d="M 0 0 L 400 400 M 0 400 L 400 0" stroke="#ffffff" stroke-width="2" />
  </g>
  <!-- Monogram text -->
  <text x="50%" y="50%" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="96" fill="#ffffff" dominant-baseline="middle" text-anchor="middle">NM</text>
  <!-- Subtitle -->
  <text x="50%" y="72%" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="16" fill="#e2e8f0" letter-spacing="2" dominant-baseline="middle" text-anchor="middle">PROFILE PHOTO</text>
  <text x="50%" y="78%" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="12" fill="#94a3b8" dominant-baseline="middle" text-anchor="middle">(Replace assets/profile-placeholder.svg)</text>
</svg>
